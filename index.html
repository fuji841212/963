<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroFilm Sim</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>RETRO<span>SIM</span></h1>
            <label class="upload-btn">
                UPLOAD PHOTO
                <input type="file" id="imageUpload" accept="image/*" hidden>
            </label>
        </header>

        <main id="preview-area">
            <canvas id="mainCanvas"></canvas>
            <div id="watermark" class="hidden">OCT 24 1998</div>
        </main>

        <section class="controls">
            <div class="control-group">
                <label>EV (曝光)</label>
                <input type="range" id="ev" min="-50" max="50" value="0">
            </div>
            <div class="control-group">
                <label>SAT (飽和度)</label>
                <input type="range" id="sat" min="0" max="200" value="100">
            </div>
            <div class="control-group">
                <label>TEMP (冷暖)</label>
                <input type="range" id="temp" min="-50" max="50" value="0">
            </div>
            <button id="saveBtn" class="save-fab">SAVE PHOTO</button>
        </section>
    </div>

    <script src="script.js?v=final"></script>
</body>
</html>
